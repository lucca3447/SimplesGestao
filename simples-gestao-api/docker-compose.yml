services:
  postgres:
    image: postgres:16-alpine
    container_name: simples_gestao_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: simples_gestao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
